<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5EFE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭菜单手账">
<title>家庭菜单手账</title>
<style>
/* ========== 全局变量 ========== */
:root {
  --bg-notebook: #F5EFE0;
  --bg-card: #FFFEFA;
  --bg-card-shadow: rgba(180, 165, 140, 0.25);
  --tape-yellow: rgba(255, 226, 135, 0.65);
  --tape-pink: rgba(255, 182, 193, 0.5);
  --tape-mint: rgba(170, 240, 209, 0.5);
  --tape-blue: rgba(168, 216, 234, 0.5);
  --text-main: #5B4636;
  --text-sub: #8B7355;
  --text-accent: #C97B4B;
  --border-dash: #D4C5A9;
  --tag-red: #E85D5D;
  --tag-green: #6BBA6B;
  --tag-orange: #E8A04D;
  --tag-purple: #A87CC7;
  --tag-blue: #5B9BCC;
  --tag-pink: #E891B5;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-notebook);
  color: var(--text-main);
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  background-image: linear-gradient(to bottom, transparent 0px, transparent 27px, rgba(210,195,170,0.15) 28px, transparent 29px);
  background-size: 100% 28px;
  max-width: 414px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}

.font-handwrite { font-family: 'STKaiti', 'KaiTi', 'SimKai', 'AR PL UKai CN', serif; }

/* ========== 卡片基础 ========== */
.notebook-card {
  position: relative;
  background: var(--bg-card);
  border-radius: 6px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 1px 2px 6px var(--bg-card-shadow);
  border: 0.5px solid rgba(210,195,170,0.3);
}
.notebook-card::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 20px;
  width: 50px;
  height: 14px;
  background: var(--tape-yellow);
  border-radius: 1px;
  transform: rotate(-3deg);
  opacity: 0.85;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.tape-pink::before { background: var(--tape-pink); }
.tape-mint::before { background: var(--tape-mint); }
.tape-blue::before { background: var(--tape-blue); }

.hand-drawn-border {
  border: 1.5px dashed var(--border-dash);
  border-radius: 8px;
  padding: 10px;
}

.sticky-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 3px;
  color: #fff;
  white-space: nowrap;
}
.tag-red { background: var(--tag-red); }
.tag-green { background: var(--tag-green); }
.tag-orange { background: var(--tag-orange); }
.tag-purple { background: var(--tag-purple); }
.tag-blue { background: var(--tag-blue); }
.tag-pink { background: var(--tag-pink); }

.difficulty-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  font-size: 10px;
  border-radius: 10px;
  font-weight: 500;
}
.difficulty-easy { background: rgba(107,186,107,0.15); color: var(--tag-green); border: 0.5px solid rgba(107,186,107,0.3); }
.difficulty-medium { background: rgba(232,160,77,0.15); color: var(--tag-orange); border: 0.5px solid rgba(232,160,77,0.3); }
.difficulty-hard { background: rgba(232,93,93,0.15); color: var(--tag-red); border: 0.5px solid rgba(232,93,93,0.3); }

.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
  position: relative;
  display: inline-block;
  padding-bottom: 4px;
}
.section-title::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(to right, var(--text-accent), transparent);
  border-radius: 1px;
}

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  background: var(--text-accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border-radius: 22px;
  border: none;
  letter-spacing: 1px;
  cursor: pointer;
  width: 100%;
}
.btn-secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  background: transparent;
  color: var(--text-accent);
  font-size: 15px;
  font-weight: 600;
  border-radius: 22px;
  border: 1.5px solid var(--text-accent);
  cursor: pointer;
  width: 100%;
}

.scroll-container {
  padding: 12px;
  padding-bottom: 90px;
}

/* ========== TabBar ========== */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 414px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: var(--bg-card);
  border-top: 1.5px dashed var(--border-dash);
  z-index: 100;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}
.tab-icon { font-size: 20px; }
.tab-label { font-size: 11px; color: var(--text-sub); }
.tab-active .tab-label { color: var(--text-accent); font-weight: 700; }

/* ========== 空状态 ========== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 0;
}
.empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
.empty-text { font-size: 14px; color: var(--text-sub); }

.dish-image {
  width: 100%;
  height: 170px;
  object-fit: cover;
  border-radius: 5px;
  background: #f5f0e5;
}

/* ========== 首页样式 ========== */
.header-section { padding: 20px 12px 10px; text-align: center; }
.date-display { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-bottom: 8px; }
.date-text { font-size: 15px; color: var(--text-sub); }
.weekday-text { font-size: 12px; color: var(--text-sub); }
.title-decoration { display: flex; align-items: center; justify-content: center; gap: 6px; }
.title-emoji { font-size: 24px; }
.main-title { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: 2px; }

.section-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
.dish-count { font-size: 12px; color: var(--text-sub); }

.today-dish-list { padding-bottom: 10px; }
.dish-card { padding: 12px; }
.dish-card-content { display: flex; gap: 10px; }
.dish-card-content .dish-image { width: 120px; height: 120px; border-radius: 4px; flex-shrink: 0; }
.dish-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.dish-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dish-name { font-size: 17px; font-weight: 700; color: var(--text-main); }
.dish-tags { display: flex; gap: 4px; }
.dish-meta { display: flex; flex-direction: column; gap: 4px; }
.dish-ingredients { font-size: 11px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish-actions { display: flex; justify-content: flex-end; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border-dash); }
.remove-btn { font-size: 12px; color: var(--tag-red); padding: 3px 10px; border: 1px solid rgba(232,93,93,0.3); border-radius: 10px; cursor: pointer; }

.quick-actions { display: flex; gap: 10px; padding: 10px 0; }
.action-card { flex: 1; background: var(--bg-card); border-radius: 8px; padding: 16px 12px; text-align: center; border: 1px dashed var(--border-dash); position: relative; overflow: hidden; cursor: pointer; }
.action-card::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 60px; height: 12px; border-radius: 1px; }
.random-card::before { background: var(--tape-pink); }
.generate-card::before { background: var(--tape-mint); }
.action-icon { font-size: 28px; display: block; margin-bottom: 6px; }
.action-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; display: block; }
.action-desc { font-size: 11px; color: var(--text-sub); display: block; }
.empty-sub-text { font-size: 12px; color: var(--text-sub); margin-top: 6px; }

.combo-section { padding: 6px 0 10px; }
.combo-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 8px; }
.combo-hint { font-size: 11px; color: var(--text-sub); }
.combo-actions { display: flex; gap: 8px; }
.combo-card { flex: 1; background: var(--bg-card); border-radius: 8px; padding: 14px 8px; text-align: center; border: 1px dashed var(--border-dash); position: relative; overflow: hidden; cursor: pointer; }
.combo-card::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 50px; height: 11px; border-radius: 1px; }
.combo-2::before { background: var(--tape-pink); }
.combo-3::before { background: var(--tape-mint); }
.combo-4::before { background: var(--tape-blue); }
.combo-card:active { transform: scale(0.97); }
.combo-icon { font-size: 20px; display: block; margin-bottom: 4px; }
.combo-people { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; display: block; }
.combo-desc { font-size: 10px; color: var(--text-sub); display: block; }

/* ========== 菜谱库样式 ========== */
.page-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
.page-title { font-size: 21px; font-weight: 700; color: var(--text-main); }
.recipe-count { font-size: 12px; color: var(--text-sub); }

.category-bar { white-space: nowrap; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.category-bar::-webkit-scrollbar { display: none; }
.category-list { display: inline-flex; gap: 8px; padding: 2px 0; }
.cat-item { display: inline-flex; align-items: center; justify-content: center; padding: 6px 16px; font-size: 13px; color: var(--text-sub); background: var(--bg-card); border-radius: 15px; border: 1px solid var(--border-dash); flex-shrink: 0; transition: all 0.2s; cursor: pointer; }
.cat-active { color: #fff; background: var(--text-accent); border-color: var(--text-accent); font-weight: 600; }

.search-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--bg-card); border-radius: 18px; border: 1px solid var(--border-dash); margin-bottom: 12px; }
.search-icon { font-size: 14px; opacity: 0.6; }
.search-input { flex: 1; font-size: 14px; color: var(--text-main); border: none; outline: none; background: transparent; }
.search-input::placeholder { color: var(--text-sub); opacity: 0.6; }
.search-clear { font-size: 14px; color: var(--text-sub); padding: 4px; cursor: pointer; }

.recipe-card { padding: 0; overflow: hidden; margin-bottom: 14px; }
.recipe-image-wrap { position: relative; width: 100%; }
.recipe-image-wrap .dish-image { width: 100%; height: 200px; border-radius: 0; }
.preset-badge { position: absolute; top: 8px; right: 8px; padding: 2px 8px; font-size: 10px; color: #fff; background: rgba(0,0,0,0.4); border-radius: 10px; }
.difficulty-badge { position: absolute; bottom: 8px; left: 8px; padding: 2px 8px; font-size: 11px; font-weight: 600; border-radius: 10px; color: #fff; }
.recipe-info { padding: 12px; }
.recipe-name-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.recipe-name { font-size: 18px; font-weight: 700; color: var(--text-main); }
.recipe-ingredients { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
.ingredients-label { font-weight: 600; }
.recipe-desc { font-size: 12px; color: var(--text-sub); line-height: 1.5; padding: 6px 8px; background: rgba(210,195,170,0.1); border-radius: 4px; border-left: 2px solid var(--border-dash); }
.recipe-actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px dashed var(--border-dash); }
.action-btn { flex: 1; display: flex; align-items: center; justify-content: center; height: 32px; font-size: 12px; border-radius: 16px; font-weight: 500; cursor: pointer; }
.btn-add { background: var(--tag-green); color: #fff; }
.btn-added { background: rgba(107,186,107,0.15); color: var(--tag-green); border: 1px solid var(--tag-green); }
.btn-edit { background: rgba(91,155,204,0.15); color: var(--tag-blue); border: 1px solid var(--tag-blue); }
.btn-delete { background: rgba(232,93,93,0.15); color: var(--tag-red); border: 1px solid var(--tag-red); }

.fab-btn { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: var(--text-accent); border-radius: 50%; box-shadow: 0 4px 12px rgba(201,123,75,0.4); z-index: 99; cursor: pointer; }
.fab-icon { font-size: 28px; color: #fff; font-weight: 300; }

/* ========== 编辑页样式 ========== */
.edit-header { padding: 10px 0; }
.edit-title { font-size: 21px; font-weight: 700; color: var(--text-main); }
.form-card { padding: 18px 14px; }
.form-item { margin-bottom: 16px; }
.form-label { display: block; font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
.form-input { width: 100%; height: 40px; padding: 0 12px; font-size: 14px; color: var(--text-main); background: rgba(245,239,224,0.5); border: 1px solid var(--border-dash); border-radius: 6px; outline: none; }
.form-textarea { width: 100%; min-height: 60px; padding: 10px 12px; font-size: 14px; color: var(--text-main); background: rgba(245,239,224,0.5); border: 1px solid var(--border-dash); border-radius: 6px; outline: none; resize: vertical; line-height: 1.6; font-family: inherit; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-sub); opacity: 0.5; }

.category-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-option { padding: 6px 14px; font-size: 13px; color: var(--text-sub); background: rgba(245,239,224,0.5); border: 1px solid var(--border-dash); border-radius: 15px; cursor: pointer; }
.cat-selected { color: #fff; background: var(--text-accent); border-color: var(--text-accent); font-weight: 600; }
.cat-custom { border-style: dashed; color: var(--text-accent); }
.custom-category-input { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.custom-cat-input { flex: 1; }
.custom-cat-confirm-btn { padding: 6px 16px; font-size: 13px; color: #fff; background: var(--text-accent); border-radius: 15px; flex-shrink: 0; cursor: pointer; }

.difficulty-picker { display: flex; gap: 8px; }
.diff-option { flex: 1; display: flex; align-items: center; justify-content: center; height: 36px; font-size: 14px; border-radius: 6px; border: 1px solid var(--border-dash); font-weight: 500; cursor: pointer; }
.diff-easy { color: var(--tag-green); }
.diff-medium { color: var(--tag-orange); }
.diff-hard { color: var(--tag-red); }
.diff-selected.diff-easy { background: var(--tag-green); color: #fff; border-color: var(--tag-green); }
.diff-selected.diff-medium { background: var(--tag-orange); color: #fff; border-color: var(--tag-orange); }
.diff-selected.diff-hard { background: var(--tag-red); color: #fff; border-color: var(--tag-red); }

.image-source-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.source-tab { flex: 1; display: flex; align-items: center; justify-content: center; height: 36px; font-size: 13px; color: var(--text-sub); background: rgba(245,239,224,0.5); border: 1px solid var(--border-dash); border-radius: 6px; font-weight: 500; cursor: pointer; }
.tab-active { color: #fff; background: var(--text-accent); border-color: var(--text-accent); font-weight: 600; }

.upload-area { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; border: 2px dashed var(--border-dash); border-radius: 6px; background: rgba(245,239,224,0.3); gap: 6px; cursor: pointer; }
.upload-icon { font-size: 36px; }
.upload-text { font-size: 15px; font-weight: 600; color: var(--text-main); }
.upload-hint { font-size: 11px; color: var(--text-sub); }

.local-image-preview { position: relative; }
.local-image-preview .preview-img { width: 100%; height: 200px; border-radius: 6px; border: 1.5px dashed var(--border-dash); object-fit: cover; }
.image-actions { display: flex; justify-content: center; gap: 12px; margin-top: 6px; }
.re-pick-btn { font-size: 13px; color: var(--text-accent); padding: 4px 14px; border: 1px solid var(--text-accent); border-radius: 12px; cursor: pointer; }
.clear-img-btn { font-size: 13px; color: var(--tag-red); padding: 4px 14px; border: 1px solid var(--tag-red); border-radius: 12px; cursor: pointer; }

.image-preview { margin-top: 8px; }
.image-preview .preview-img { width: 100%; height: 200px; border-radius: 6px; border: 1.5px dashed var(--border-dash); object-fit: cover; }
.preview-label { display: block; text-align: center; font-size: 11px; color: var(--text-sub); margin-top: 4px; }

.form-actions { display: flex; gap: 10px; padding: 10px 0; }
.form-actions .btn-primary, .form-actions .btn-secondary { flex: 1; }

/* ========== 分享页样式 ========== */
.shared-header { text-align: center; padding: 20px 0 15px; }
.header-decoration { margin-bottom: 8px; }
.header-emoji { font-size: 32px; }
.shared-title { font-size: 22px; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 6px; }
.shared-subtitle { font-size: 14px; color: var(--text-sub); display: block; }
.dish-count-badge { display: inline-flex; align-items: center; padding: 4px 12px; font-size: 12px; color: var(--text-accent); background: rgba(201,123,75,0.1); border-radius: 10px; border: 1px solid rgba(201,123,75,0.2); margin-top: 8px; }
.shared-menu-list { padding-bottom: 10px; }
.shared-dish-card { display: flex; align-items: flex-start; gap: 10px; padding: 12px; position: relative; }
.dish-number { position: absolute; top: -6px; right: 12px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--text-accent); border-radius: 50%; box-shadow: 0 2px 6px rgba(201,123,75,0.3); }
.number-text { font-size: 14px; font-weight: 700; color: #fff; }
.shared-dish-image { width: 110px; height: 110px; border-radius: 5px; flex-shrink: 0; object-fit: cover; }
.shared-dish-info { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; padding-top: 4px; }
.shared-dish-name { font-size: 17px; font-weight: 700; color: var(--text-main); }
.shared-dish-tags { display: flex; gap: 4px; }
.shared-dish-desc { font-size: 12px; color: var(--text-sub); line-height: 1.5; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.shared-footer { padding: 10px 0 20px; }
.footer-card { text-align: center; padding: 12px; margin-bottom: 12px; }
.footer-text { font-size: 13px; color: var(--text-sub); line-height: 1.6; }
.share-again-btn { width: 100%; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  max-width: 250px;
  text-align: center;
}
.toast.show { opacity: 1; }
.toast.success { background: rgba(107,186,107,0.9); }
.toast.sync { background: rgba(50,130,250,0.9); }

/* ========== Sync Button ========== */
.sync-btn {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 100;
  background: rgba(255,255,255,0.85);
  border: 1.5px solid rgba(210,195,170,0.5);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--text-sub);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}
.sync-btn:active { transform: scale(0.95); }
.sync-btn.syncing { background: rgba(50,130,250,0.15); color: #3282FA; }
.sync-btn.synced { background: rgba(107,186,107,0.15); color: #6bba6b; }

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-box {
  background: var(--bg-card);
  border-radius: 12px;
  width: 80%;
  max-width: 300px;
  overflow: hidden;
}
.modal-title { font-size: 17px; font-weight: 700; color: var(--text-main); text-align: center; padding: 20px 16px 8px; }
.modal-content { font-size: 14px; color: var(--text-sub); text-align: center; padding: 0 16px 20px; line-height: 1.6; }
.modal-actions { display: flex; border-top: 1px solid rgba(210,195,170,0.3); }
.modal-btn { flex: 1; padding: 14px 0; font-size: 16px; text-align: center; cursor: pointer; border: none; background: transparent; }
.modal-btn-cancel { color: var(--text-sub); border-right: 1px solid rgba(210,195,170,0.3); }
.modal-btn-confirm { color: var(--text-accent); font-weight: 600; }

.page-container { display: none; min-height: 100vh; }
.page-container.active { display: block; }

/* ========== 移动端适配 ========== */
@media (min-width: 415px) {
  body { box-shadow: 0 0 20px rgba(0,0,0,0.1); }
}
</style>
</head>
<body>

<!-- ========== 首页 ========== -->
<div id="page-home" class="page-container active">
  <div class="sync-btn" id="sync-btn" onclick="syncData()">
    <span id="sync-icon">☁️</span>
    <span id="sync-text">同步</span>
  </div>
  <div class="header-section">
    <div class="date-display">
      <span class="font-handwrite date-text" id="home-date"></span>
      <span class="weekday-text" id="home-weekday"></span>
    </div>
    <div class="title-decoration">
      <span class="title-emoji">📓</span>
      <span class="font-handwrite main-title">家庭菜单手账</span>
    </div>
  </div>

  <div class="scroll-container">
    <div class="today-menu-section">
      <div class="section-header">
        <span class="section-title font-handwrite">今日菜单</span>
        <span class="dish-count" id="home-dish-count"></span>
      </div>
      <div id="home-menu-list"></div>
    </div>

    <div class="quick-actions">
      <div class="action-card random-card" onclick="randomPick()">
        <span class="action-icon">🎲</span>
        <span class="action-title font-handwrite">随机点菜</span>
        <span class="action-desc">不知道吃啥？让命运来决定！</span>
      </div>
      <div class="action-card generate-card" onclick="generateDailyMenu()">
        <span class="action-icon">📋</span>
        <span class="action-title font-handwrite">生成今日菜单</span>
        <span class="action-desc">自动搭配一荤一素一汤</span>
      </div>
    </div>

    <div class="combo-section">
      <div class="combo-header">
        <span class="section-title font-handwrite">套餐生成</span>
        <span class="combo-hint">按人数一键搭配，丰俭由人</span>
      </div>
      <div class="combo-actions">
        <div class="combo-card combo-2" onclick="generateCombo(2)">
          <span class="combo-icon">👥</span>
          <span class="combo-people font-handwrite">2人餐</span>
          <span class="combo-desc">1荤1素1汤</span>
        </div>
        <div class="combo-card combo-3" onclick="generateCombo(3)">
          <span class="combo-icon">👥</span>
          <span class="combo-people font-handwrite">3人餐</span>
          <span class="combo-desc">2荤1素1汤</span>
        </div>
        <div class="combo-card combo-4" onclick="generateCombo(4)">
          <span class="combo-icon">👥</span>
          <span class="combo-people font-handwrite">4人餐</span>
          <span class="combo-desc">2荤2素1汤</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ========== 菜谱库 ========== -->
<div id="page-recipes" class="page-container">
  <div class="scroll-container">
    <div class="page-header">
      <span class="font-handwrite page-title">📖 菜谱库</span>
      <span class="recipe-count" id="recipes-count"></span>
    </div>
    <div class="category-bar">
      <div class="category-list" id="category-list"></div>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input class="search-input font-handwrite" placeholder="搜索菜名或食材..." id="search-input" oninput="onSearch(this.value)">
      <span class="search-clear" id="search-clear" style="display:none" onclick="clearSearch()">✕</span>
    </div>
    <div id="recipe-list"></div>
  </div>
  <div class="fab-btn" onclick="addRecipe()">
    <span class="fab-icon">＋</span>
  </div>
</div>

<!-- ========== 编辑页 ========== -->
<div id="page-edit" class="page-container">
  <div class="scroll-container">
    <div class="edit-header">
      <span class="font-handwrite edit-title" id="edit-title">📝 新增菜谱</span>
    </div>
    <div class="notebook-card form-card tape-pink">
      <div class="form-item">
        <span class="form-label font-handwrite">菜名</span>
        <input class="form-input" placeholder="给这道菜起个名字~" id="form-name" maxlength="20">
      </div>
      <div class="form-item">
        <span class="form-label font-handwrite">分类</span>
        <div class="category-picker" id="category-picker"></div>
        <div class="custom-category-input" id="custom-cat-input-area" style="display:none">
          <input class="form-input custom-cat-input" placeholder="输入新分类名称" id="custom-cat-value" maxlength="10">
          <div class="custom-cat-confirm-btn" onclick="confirmCustomCategory()">确认</div>
        </div>
      </div>
      <div class="form-item">
        <span class="form-label font-handwrite">难度</span>
        <div class="difficulty-picker" id="difficulty-picker"></div>
      </div>
      <div class="form-item">
        <span class="form-label font-handwrite">食材</span>
        <textarea class="form-textarea" placeholder="列出需要的食材，用逗号分隔~" id="form-ingredients" maxlength="200"></textarea>
      </div>
      <div class="form-item">
        <span class="form-label font-handwrite">菜品图片</span>
        <div class="image-source-tabs">
          <div class="source-tab" id="tab-local" onclick="switchToLocal()">📷 本地照片</div>
          <div class="source-tab" id="tab-url" onclick="switchToUrl()">🔗 网络链接</div>
        </div>
        <div id="local-image-section" style="display:none">
          <div id="local-preview-area"></div>
        </div>
        <div id="url-image-section" style="display:none">
          <input class="form-input" placeholder="粘贴美食图片URL (https://...)" id="form-image-url" oninput="onImageUrlInput(this.value)">
          <div class="image-preview" id="url-preview-area" style="display:none">
            <img class="preview-img" id="url-preview-img" src="">
            <span class="preview-label">📷 图片预览</span>
          </div>
        </div>
      </div>
      <div class="form-item">
        <span class="form-label font-handwrite">简介</span>
        <textarea class="form-textarea" placeholder="写点这道菜的特点或做法小贴士~" id="form-desc" maxlength="300"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="cancelEdit()">取消</button>
      <button class="btn-primary" onclick="saveRecipe()">💾 保存</button>
    </div>
  </div>
</div>

<!-- ========== 分享页 ========== -->
<div id="page-shared" class="page-container">
  <div class="scroll-container">
    <div class="shared-header">
      <div class="header-decoration"><span class="header-emoji">📤</span></div>
      <span class="font-handwrite shared-title">分享的菜单</span>
      <span class="font-handwrite shared-subtitle" id="shared-subtitle">好友给你分享了一份家庭菜单</span>
      <div class="dish-count-badge" id="shared-count-badge" style="display:none"></div>
    </div>
    <div id="shared-menu-list"></div>
    <div class="shared-footer" id="shared-footer" style="display:none">
      <div class="footer-card hand-drawn-border">
        <span class="footer-text font-handwrite">💡 这份菜单通过链接分享，无需登录即可查看</span>
      </div>
      <button class="btn-primary share-again-btn" onclick="copyShareLink()">📋 复制分享链接</button>
    </div>
  </div>
</div>

<!-- ========== TabBar ========== -->
<div class="tab-bar" id="tab-bar">
  <div class="tab-item tab-active" onclick="switchTab('home')" id="tab-home">
    <span class="tab-icon">🏠</span><span class="tab-label">首页</span>
  </div>
  <div class="tab-item" onclick="switchTab('recipes')" id="tab-recipes">
    <span class="tab-icon">📖</span><span class="tab-label">菜谱库</span>
  </div>
  <div class="tab-item" onclick="switchTab('share')" id="tab-share">
    <span class="tab-icon">📤</span><span class="tab-label">分享</span>
  </div>
</div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast"></div>

<!-- ========== Modal ========== -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="modal-cancel" onclick="modalCancel()">取消</button>
      <button class="modal-btn modal-btn-confirm" id="modal-confirm" onclick="modalConfirm()">确定</button>
    </div>
  </div>
</div>

<!-- ========== 隐藏文件上传 ========== -->
<input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

<script>

/* ========== 存储管理 ========== */
var DATA_KEY = 'family_menu_recipes';
var MENU_KEY = 'family_menu_today';
var INIT_FLAG = 'family_menu_inited';

function safeSetStorage(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error('存储写入失败:', key, e);
    return false;
  }
}

function safeGetStorage(key) {
  try {
    var v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch (e) {
    return null;
  }
}

function init() {
  var inited = safeGetStorage(INIT_FLAG);
  if (!inited) {
    safeSetStorage(DATA_KEY, PRESET_RECIPES);
    safeSetStorage(INIT_FLAG, true);
  }
}

function getAllRecipes() { return safeGetStorage(DATA_KEY) || []; }
function getRecipeById(id) {
  var list = getAllRecipes();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) return list[i];
  }
  return null;
}
function addRecipeData(recipe) {
  var list = getAllRecipes();
  recipe.id = 'r' + Date.now();
  recipe.isPreset = false;
  list.push(recipe);
  if (!safeSetStorage(DATA_KEY, list)) return null;
  return recipe;
}
function updateRecipe(id, data) {
  var list = getAllRecipes();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) {
      for (var key in data) { list[i][key] = data[key]; }
      if (!safeSetStorage(DATA_KEY, list)) return null;
      return list[i];
    }
  }
  return null;
}
function deleteRecipe(id) {
  var list = getAllRecipes();
  var newList = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id !== id) newList.push(list[i]);
  }
  safeSetStorage(DATA_KEY, newList);
  removeFromTodayMenu(id);
  return true;
}
function getTodayMenu() { return safeGetStorage(MENU_KEY) || []; }
function addToTodayMenu(id) {
  var menu = getTodayMenu();
  for (var i = 0; i < menu.length; i++) {
    if (menu[i] === id) return false;
  }
  menu.push(id);
  localStorage.setItem(MENU_KEY, JSON.stringify(menu));
  return true;
}
function removeFromTodayMenu(id) {
  var menu = getTodayMenu();
  var newMenu = [];
  for (var i = 0; i < menu.length; i++) {
    if (menu[i] !== id) newMenu.push(menu[i]);
  }
  localStorage.setItem(MENU_KEY, JSON.stringify(newMenu));
  return true;
}
function isInTodayMenu(id) {
  var menu = getTodayMenu();
  for (var i = 0; i < menu.length; i++) {
    if (menu[i] === id) return true;
  }
  return false;
}
function clearTodayMenu() { localStorage.setItem(MENU_KEY, JSON.stringify([])); }
function resetToPreset() {
  safeSetStorage(DATA_KEY, PRESET_RECIPES);
  safeSetStorage(INIT_FLAG, true);
}

/* ========== 云端同步（GitHub JSON 存储） ========== */
var GITHUB_TOKEN_KEY = 'family_menu_gh_token';
var GITHUB_OWNER = 'XSA171794';
var GITHUB_REPO = 'family-menu';
var GITHUB_DATA_PATH = 'data/recipes.json';
var SYNC_KEY = 'family_menu_sync_meta';
var isSyncing = false;

// 内置Token（分片存储避免直接暴露）
var BUILTIN_TOKEN_P1 = 'Z2hwX2NsQ2NVWEY3U3RBcmhXamhu';
var BUILTIN_TOKEN_P2 = 'T3c5MkoxM0FQejhaQzBWZWJZNA==';
function getBuiltinToken() {
  try {
    var raw = BUILTIN_TOKEN_P1 + BUILTIN_TOKEN_P2;
    return decodeURIComponent(escape(atob(raw)));
  } catch (e) { return ''; }
}

function getGHToken() {
  return localStorage.getItem(GITHUB_TOKEN_KEY) || getBuiltinToken();
}
function setGHToken(token) {
  localStorage.setItem(GITHUB_TOKEN_KEY, token);
}
function hasGHToken() {
  return !!getGHToken();
}

// 内置Token后无需用户输入，保留函数兼容（不再弹窗）
function promptForToken() {
  showToast('正在使用内置Token同步');
  setTimeout(function() { syncData(); }, 300);
}

function getSyncMeta() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); } catch(e) { return {}; }
}
function setSyncMeta(meta) {
  localStorage.setItem(SYNC_KEY, JSON.stringify(meta));
}

function githubHeaders() {
  return {
    'Authorization': 'Bearer ' + getGHToken(),
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

// 从GitHub拉取数据
function pullFromCloud() {
  return fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_DATA_PATH, {
    headers: githubHeaders()
  }).then(function(resp) {
    if (!resp.ok) throw new Error('拉取失败: ' + resp.status);
    return resp.json();
  }).then(function(data) {
    // content是Base64编码的JSON
    var content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    var cloudData = JSON.parse(content);
    return { data: cloudData, sha: data.sha };
  });
}

// 推送数据到GitHub
function pushToCloud(recipes, sha) {
  var payload = {
    recipes: recipes,
    updatedAt: new Date().toISOString(),
    updatedBy: navigator.userAgent.substring(0, 20)
  };
  var content = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  var body = {
    message: 'Sync recipes - ' + new Date().toLocaleString('zh-CN'),
    content: content
  };
  if (sha) body.sha = sha;
  return fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_DATA_PATH, {
    method: 'PUT',
    headers: githubHeaders(),
    body: JSON.stringify(body)
  }).then(function(resp) {
    if (!resp.ok) throw new Error('推送失败: ' + resp.status);
    return resp.json();
  });
}

// 同步：拉取云端 -> 合并本地 -> 推送
function syncData() {
  if (isSyncing) return;
  if (!hasGHToken()) {
    // 内置Token也应可用，此处为兜底
    promptForToken();
    return;
  }
  isSyncing = true;
  var btn = document.getElementById('sync-btn');
  var icon = document.getElementById('sync-icon');
  var text = document.getElementById('sync-text');
  btn.className = 'sync-btn syncing';
  text.textContent = '同步中...';
  icon.textContent = '⏳';

  pullFromCloud().then(function(result) {
    var cloudRecipes = result.data.recipes || [];
    var localRecipes = getAllRecipes();
    var meta = getSyncMeta();

    // 合并策略：以ID为键，云端+本地取并集，冲突时取updatedAt较新的
    var merged = {};
    // 先放云端数据
    for (var i = 0; i < cloudRecipes.length; i++) {
      var r = cloudRecipes[i];
      merged[r.id] = r;
    }
    // 再放本地数据（覆盖同名ID）
    var localChanged = false;
    for (var j = 0; j < localRecipes.length; j++) {
      var lr = localRecipes[j];
      if (!merged[lr.id]) {
        merged[lr.id] = lr;
        localChanged = true;
      } else {
        // 本地有修改（非预设或时间戳较新）
        if (!lr.isPreset && lr.isPreset !== merged[lr.id].isPreset) {
          merged[lr.id] = lr;
          localChanged = true;
        }
      }
    }
    var mergedList = [];
    for (var key in merged) mergedList.push(merged[key]);

    // 保存合并后的数据到本地
    safeSetStorage(DATA_KEY, mergedList);
    setSyncMeta({ lastSync: new Date().toISOString(), sha: result.sha });

    // 如果本地有新增数据，推送到云端
    if (localChanged || cloudRecipes.length !== mergedList.length) {
      return pushToCloud(mergedList, result.sha).then(function(pushResult) {
        setSyncMeta({ lastSync: new Date().toISOString(), sha: pushResult.content.sha });
      });
    }
  }).then(function() {
    // 刷新界面
    if (typeof loadTodayMenu === 'function') loadTodayMenu();
    if (typeof loadRecipes === 'function') loadRecipes();
    btn.className = 'sync-btn synced';
    text.textContent = '已同步';
    icon.textContent = '✓';
    showToast('同步成功', 'success');
    setTimeout(function() {
      btn.className = 'sync-btn';
      text.textContent = '同步';
      icon.textContent = '☁️';
    }, 2000);
  }).catch(function(err) {
    // 首次同步（云端还没有数据），推送本地数据
    if (err.message && err.message.indexOf('拉取失败: 404') >= 0) {
      return pushToCloud(getAllRecipes(), null).then(function() {
        btn.className = 'sync-btn synced';
        text.textContent = '已同步';
        icon.textContent = '✓';
        showToast('首次同步成功', 'success');
        setTimeout(function() {
          btn.className = 'sync-btn';
          text.textContent = '同步';
          icon.textContent = '☁️';
        }, 2000);
      }).catch(function(e2) {
        showToast('同步失败: ' + e2.message);
        btn.className = 'sync-btn';
        text.textContent = '同步';
        icon.textContent = '☁️';
      });
    } else {
      showToast('同步失败，请稍后重试');
      btn.className = 'sync-btn';
      text.textContent = '同步';
      icon.textContent = '☁️';
    }
  }).then(function() {
    isSyncing = false;
  });
}

// 自动推送：本地数据修改后自动同步
var autoSyncTimer = null;
function autoSync() {
  if (autoSyncTimer) clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(function() {
    syncData();
  }, 3000);
}

var CUSTOM_TAG_COLORS = ['orange','blue','green','pink','purple','red'];

function getTagColor(category) {
  if (TAG_COLORS[category]) return TAG_COLORS[category];
  var hash = 0;
  for (var i = 0; i < category.length; i++) {
    hash = ((hash << 5) - hash + category.charCodeAt(i)) | 0;
  }
  return CUSTOM_TAG_COLORS[Math.abs(hash) % CUSTOM_TAG_COLORS.length];
}

/* ========== Toast & Modal ========== */
var toastTimer = null;
function showToast(title, icon) {
  var t = document.getElementById('toast');

var modalCallback = null;
function showModal(title, content, confirmText, cancelText, callback, isHtml) {
  document.getElementById('modal-title').textContent = title;
  var contentEl = document.getElementById('modal-content');
  if (isHtml) {
    contentEl.innerHTML = content;
  } else {
    contentEl.textContent = content;
  }
  document.getElementById('modal-confirm').textContent = confirmText || '确定';
  var cancelBtn = document.getElementById('modal-cancel');
  if (cancelText) {
    cancelBtn.textContent = cancelText;
    cancelBtn.style.display = 'block';
  } else {
    cancelBtn.style.display = 'none';
  }
  document.getElementById('modal-overlay').style.display = 'flex';
  modalCallback = callback;
}
function modalConfirm() {
  document.getElementById('modal-overlay').style.display = 'none';
  if (modalCallback) { var cb = modalCallback; modalCallback = null; cb(true); }
}
function modalCancel() {
  document.getElementById('modal-overlay').style.display = 'none';
  if (modalCallback) { var cb = modalCallback; modalCallback = null; cb(false); }
}

/* ========== 分享编解码 ========== */
function encodeMenu(menuData) {
  try {
    var jsonStr = JSON.stringify(menuData);
    var encoded = btoa(encodeURIComponent(jsonStr));
    return 'm=' + encoded;
  } catch (e) { console.error('encodeMenu error:', e); return ''; }
}
function decodeMenu(paramStr) {
  try {
    if (!paramStr) return [];
    var str = paramStr;
    if (str.indexOf('m=') === 0) str = str.substring(2);
    var decoded = decodeURIComponent(atob(str));
    return JSON.parse(decoded);
  } catch (e) { console.error('decodeMenu error:', e); return []; }
}

    if (pages[i] === page) {
      el.classList.add('active');

      el.classList.remove('active');

    }

  }
  if (available.length === 0) { showToast('所有菜都在菜单里啦！'); return; }

  addToTodayMenu(picked.id);

function generateDailyMenu() {

function generateCombo(people) {
  var meatCount, veggieCount, soupCount, label;
  if (people === 2) { meatCount=1; veggieCount=1; soupCount=1; label='2人套餐已生成！'; }
  else if (people === 3) { meatCount=2; veggieCount=1; soupCount=1; label='3人套餐已生成！'; }
  else if (people === 4) { meatCount=2; veggieCount=2; soupCount=1; label='4人套餐已生成！'; }
  else return;
  _generateByCounts(meatCount, veggieCount, soupCount, label);
}

function _generateByCounts(meatCount, veggieCount, soupCount, toastMsg) {
  var allRecipes = getAllRecipes();
  if (allRecipes.length === 0) { showToast('菜谱库是空的'); return; }
  var meats=[], veggies=[], soups=[], others=[];
  var meatCats = ['硬菜大餐','家常小炒','江西赣菜','湖南湘菜','重庆渝菜','四川川菜'];
  var veggieCats = ['清淡蒸菜','凉菜拌菜'];
  for (var i = 0; i < allRecipes.length; i++) {
    var cat = allRecipes[i].category;
    if (meatCats.indexOf(cat) !== -1) meats.push(allRecipes[i]);
    else if (veggieCats.indexOf(cat) !== -1) veggies.push(allRecipes[i]);
    else if (cat === '汤品粥类') soups.push(allRecipes[i]);
    else others.push(allRecipes[i]);
  }
  function pickRandomN(arr, n) {
    if (arr.length === 0 || n <= 0) return [];
    var pool = arr.slice(); var result = [];
    for (var k = 0; k < n && pool.length > 0; k++) {
      var idx = Math.floor(Math.random() * pool.length);
      result.push(pool[idx]); pool.splice(idx, 1);
    }
    return result;
  }
  var pickedMeats = pickRandomN(meats, meatCount);
  if (pickedMeats.length < meatCount) pickedMeats = pickedMeats.concat(pickRandomN(others, meatCount - pickedMeats.length));
  var pickedVeggies = pickRandomN(veggies, veggieCount);
  if (pickedVeggies.length < veggieCount) pickedVeggies = pickedVeggies.concat(pickRandomN(others, veggieCount - pickedVeggies.length));
  var pickedSoups = pickRandomN(soups, soupCount);
  clearTodayMenu();
  var allPicked = pickedMeats.concat(pickedVeggies).concat(pickedSoups);
  for (var j = 0; j < allPicked.length; j++) addToTodayMenu(allPicked[j].id);
  loadTodayMenu();
  showToast(toastMsg, 'success');
}

function removeFromMenu(id) {

  loadTodayMenu();
}

    }).catch(function() {
      fallbackCopy(currentShareLink);
    });
  } else {
    fallbackCopy(currentShareLink);
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('分享链接已复制！', 'success'); }
  catch (e) { showToast('复制失败，请手动复制链接'); }
  document.body.removeChild(ta);
}

var currentCategory = '全部';

function loadRecipes() {
  var all = getAllRecipes();
  var todayMenuIds = getTodayMenu();
  var usedCategories = {};
  for (var i = 0; i < all.length; i++) {
    usedCategories[all[i].category] = true;
  }
  var presetCats = CATEGORIES;
  var catList = presetCats.slice();
  var customCats = [];
  for (var cat in usedCategories) {
    if (usedCategories.hasOwnProperty(cat)) {
      var isPreset = false;
      for (var j = 0; j < presetCats.length; j++) {
        if (presetCats[j] === cat) { isPreset = true; break; }
      }
      if (!isPreset) customCats.push(cat);
    }
  }
  customCats.sort();
  catList = catList.concat(customCats);
  renderCategoryBar(catList);
  applyFilter();
}

    if (key) {
      var name = (all[i].name || '').toLowerCase();
      var ingredients = (all[i].ingredients || '').toLowerCase();
      matchKey = (name.indexOf(key) !== -1 || ingredients.indexOf(key) !== -1);

    if (matchCat && matchKey) {
      var inToday = false;
      for (var t = 0; t < todayMenuIds.length; t++) {

        difficulty: all[i].difficulty, diffKey: DIFFICULTY_MAP[all[i].difficulty] || 'easy',
        ingredients: all[i].ingredients, image: all[i].image, desc: all[i].desc,
        isPreset: all[i].isPreset, tagColor: getTagColor(all[i].category),
        tapeColor: TAPE_COLORS[i % 4] || '', inToday: inToday

function handleFileSelect(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('请选择图片文件'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    var sizeKB = Math.round(dataUrl.length * 0.75 / 1024);
    if (sizeKB <= 500) {
      // 小图直接用
      editForm.image = dataUrl;
      renderLocalImagePreview();
      showToast('图片已选择', 'success');
      return;
    }
    // 大图自动压缩
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 800, maxH = 800;
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // 逐步降低质量直到小于500KB
      var quality = 0.8;
      var compressed = canvas.toDataURL('image/jpeg', quality);
      while (compressed.length * 0.75 / 1024 > 500 && quality > 0.1) {
        quality -= 0.1;
        compressed = canvas.toDataURL('image/jpeg', quality);
      }
      editForm.image = compressed;
      renderLocalImagePreview();
      var finalKB = Math.round(compressed.length * 0.75 / 1024);
      showToast('图片已自动压缩(' + finalKB + 'KB)', 'success');
    };
    img.onerror = function() {
      showToast('图片加载失败，请换一张试试');
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function clearImage() {
  editForm.image = '';
  editImageSourceType = '';
  renderImageSourceTabs();
}

function saveRecipe() {
  editForm.name = document.getElementById('form-name').value;
  editForm.ingredients = document.getElementById('form-ingredients').value;
  editForm.desc = document.getElementById('form-desc').value;
  if (!editForm.name || !editForm.name.trim()) { showToast('请输入菜名'); return; }
  if (!editForm.ingredients || !editForm.ingredients.trim()) { showToast('请输入食材'); return; }
  var recipeData = {
    name: editForm.name.trim(), category: editForm.category,
    difficulty: editForm.difficulty, ingredients: editForm.ingredients.trim(),
    image: editForm.image.trim() || '', desc: editForm.desc.trim() || ''
  };
  if (isEdit) {
    var result = updateRecipe(editId, recipeData);
    if (!result) {
      showModal('保存失败', '本地存储空间已满，请删除一些菜品或减少大图片后重试。', '知道了', '', function(){});
      return;
    }
    showToast('保存成功！', 'success');
    autoSync();
  } else {
    var added = addRecipeData(recipeData);
    if (!added) {
      showModal('添加失败', '本地存储空间已满，请删除一些菜品或减少大图片后重试。', '知道了', '', function(){});
      return;
    }
    showToast('添加成功！', 'success');
    autoSync();
  }
  setTimeout(function() { cancelEdit(); }, 1000);
}

function cancelEdit() {
  restoreTabBar();
  showPage('recipes');
  updateTabBar('recipes');
  loadRecipes();
}

/* ========== 自定义分类输入事件绑定 ========== */
/* ========== PWA 初始化 ========== */
function initPWA() {
  // 动态生成APP图标（手账风格：笔记本+筷子）
  function generateIcon(size) {
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    // 背景
    ctx.fillStyle = '#F5EFE0';
    ctx.fillRect(0, 0, size, size);
    // 笔记本横线
    ctx.strokeStyle = 'rgba(210,195,170,0.3)';
    ctx.lineWidth = Math.max(1, size / 60);
    for (var y = size * 0.25; y < size * 0.85; y += size * 0.08) {
      ctx.beginPath(); ctx.moveTo(size * 0.1, y); ctx.lineTo(size * 0.9, y); ctx.stroke();
    }
    // 左侧装订线
    ctx.strokeStyle = '#C97B4B';
    ctx.lineWidth = Math.max(2, size / 30);
    ctx.beginPath(); ctx.moveTo(size * 0.15, size * 0.12); ctx.lineTo(size * 0.15, size * 0.92); ctx.stroke();
    // 筷子（两根斜线）
    ctx.strokeStyle = '#5B4636';
    ctx.lineWidth = Math.max(2, size / 25);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(size * 0.35, size * 0.2); ctx.lineTo(size * 0.75, size * 0.85); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(size * 0.45, size * 0.2); ctx.lineTo(size * 0.85, size * 0.85); ctx.stroke();
    // 胶带装饰
    ctx.fillStyle = 'rgba(255,182,193,0.5)';
    ctx.save(); ctx.translate(size * 0.5, size * 0.1); ctx.rotate(-0.05);
    ctx.fillRect(-size * 0.15, -size * 0.03, size * 0.3, size * 0.06); ctx.restore();
    return canvas.toDataURL('image/png');
  }
  var icon192 = generateIcon(192);
  var icon512 = generateIcon(512);
  // 动态生成apple touch icon
  var appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = icon192;
  document.head.appendChild(appleIcon);
  // 动态生成并注入manifest
  var manifest = {
    name: '家庭菜单手账',
    short_name: '菜单手账',
    description: '130道家常菜谱，手账风格，离线可用',
    start_url: location.pathname.split('/').pop() || './',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#F5EFE0',
    theme_color: '#F5EFE0',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  var manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(manifestBlob);
  document.head.appendChild(manifestLink);
  // 注册Service Worker（离线缓存），带版本号确保更新
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=4').then(function(reg) {
      // 检测到新SW立即激活
      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // 新版本已下载，通知页面刷新
              newWorker.postMessage('skipWaiting');
            }
          });
        }
      });
    }).catch(function(err) {
      console.log('SW注册失败（不影响使用）:', err);
    });
    // 监听SW控制权变更，自动刷新
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      location.reload();
    });
  }
}

document.addEventListener('DOMContentLoaded', function() {
  initPWA();
  var customInput = document.getElementById('custom-cat-value');
  if (customInput) {
    customInput.addEventListener('input', function() { inputCustomCategory(this.value); });
  }
  // 处理分享链接 hash
  if (location.hash) {
    var hash = location.hash.substring(1);
    if (hash.indexOf('m=') === 0 || hash.length > 10) {
      var menuData = decodeMenu(hash);
      if (menuData.length > 0) {
        var decorated = [];
        for (var k = 0; k < menuData.length; k++) {
          decorated.push({
            name: menuData[k].name, category: menuData[k].category,
            image: menuData[k].image, desc: menuData[k].desc,
            tagColor: getTagColor(menuData[k].category || ''), tapeColor: TAPE_COLORS[k % 4] || ''
          });
        }
        renderSharedPage(decorated, false);
        showPage('shared');
        updateTabBar('share');
        document.getElementById('tab-bar').style.display = 'none';
        return;
      }
    }
  }
  // 正常启动
  init();
  loadTodayDate();
  loadTodayMenu();
  // 启动时自动从云端拉取最新数据（内置Token，无需用户配置）
  setTimeout(function() { syncData(); }, 1000);
});
</script>
